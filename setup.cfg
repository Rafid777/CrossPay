[metadata]
name = crosspay
version = 2.1.0
author = CrossPay Engineering Team
author_email = crosspay-team@webank-challenge.org
description = AI Financial Assistant & RegTech Platform for International Students in China
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/shahfahim/CrossPay
license = MIT
license_files = LICENSE
platforms = any

[options]
packages = find:
python_requires = >=3.10
include_package_data = True
install_requires =
    streamlit>=1.40.0
    google-genai>=2.30.1
    python-dotenv>=1.0.0
    pytest>=8.0.0
    pytest-cov>=5.0.0
    rich>=13.0.0
    pycountry>=24.6.1
    plotly>=5.24.0
    kaleido>=0.2.1
    reportlab>=4.2.0
    pandas>=2.0.0
    faker>=30.0.0
    scikit-learn>=1.4.0
    joblib>=1.3.0

[options.packages.find]
exclude =
    tests*
    docs*
    scripts*
